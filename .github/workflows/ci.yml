name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Fixture, API, web, and E2E checks
    runs-on: ubuntu-latest
    env:
      NOTIFICATION_DRY_RUN: "true"
      MOAVIEW_WEB_BASE_URL: http://127.0.0.1:3000
      MOAVIEW_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt pytest

      - name: Run fixture validation
        run: python scripts/validate_fixtures.py

      - name: Run pytest
        run: python -m pytest tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run web typecheck
        run: npm run check

      - name: Run web unit tests
        run: npm --workspace apps/web run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run e2e

      - name: Run make check
        run: make check
