services:
  web:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm install && npm --workspace apps/web run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  api:
    image: python:3.14-slim
    working_dir: /workspace
    command: sh -c "pip install -r services/api/requirements.txt && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
